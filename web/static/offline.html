<!doctype html>
<html lang="pt" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · Aura Ciclos</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <meta name="theme-color" content="#fdf9f6" />
  </head>
  <body class="bg-ink text-foam min-h-screen flex items-center justify-center p-6">
    <div class="bg-surface-container-lowest rounded-3xl p-8 max-w-md text-center shadow-sm">
      <h1 class="text-2xl font-bold tracking-tight mb-2">Você está offline</h1>
      <p class="text-on-surface-variant mb-6">Reconecte para carregar o ciclo e os registros deste aparelho.</p>
      <button
        onclick="location.reload()"
        class="rounded-full bg-primary text-on-primary font-semibold py-2.5 px-5"
      >
        Tentar de novo
      </button>
    </div>
  </body>
</html>
